name: Docker Publish

on:
  push: {}
  workflow_dispatch: {}

env:
  REGISTRY: ghcr.io

permissions:
  contents: read
  packages: write

jobs:
  docker-publish:
    runs-on: ubuntu-latest

    steps:
      - uses: luzifer/actions/docker-publish@477b5365d3a6b728808bbd4e75debdfed00b5746 # develop
        with:
          push: ${{ github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v') }}
          registry: ${{ env.REGISTRY }}
