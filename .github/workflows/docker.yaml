name: Docker Publish

on:
  push: {}
  workflow_dispatch: {}

env:
  REGISTRY: ghcr.io

permissions:
  contents: read
  packages: write

jobs:
  docker-publish:
    runs-on: ubuntu-latest

    steps:
      - uses: luzifer/actions/docker-publish@207fd028b122b60f8218cbfff0cb7401d55f29a1 # develop
        with:
          push: ${{ github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v') }}
          registry: ${{ env.REGISTRY }}
